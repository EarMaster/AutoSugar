name: Google Play Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: GitHub release tag to deploy (e.g. v1.2.3)
        required: true
        type: string
      track:
        description: Google Play track to upload to
        required: false
        default: internal
        type: string
      changesNotSentForReview:
        description: >-
          Commit the edit without sending it for review. Required whenever Play has decided
          the release must be submitted by hand from the Console.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to deploy (e.g. v1.2.3)
        required: true
      track:
        description: Google Play track to upload to
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      changesNotSentForReview:
        description: Commit the edit without sending it for review
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    name: Upload to Google Play
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag and version
        id: resolve
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download AAB from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.resolve.outputs.tag }}" \
            --repo ${{ github.repository }} \
            --pattern "*.aab" \
            --dir release-assets

      - name: Download ProGuard mapping if the release has one
        id: mapping
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release.yml attaches mapping.txt only when the build actually produced one, so a
          # release without it is legitimate and must not fail the deploy — it just means Play
          # gets no deobfuscation file. Downloading it in the same call as the AAB made it a
          # hard requirement that the release workflow never guaranteed.
          if gh release download "${{ steps.resolve.outputs.tag }}" \
               --repo ${{ github.repository }} \
               --pattern "mapping.txt" \
               --dir release-assets; then
            echo "path=release-assets/mapping.txt" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No mapping.txt attached to ${{ steps.resolve.outputs.tag }} — uploading without a deobfuscation file."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare what's new
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          mkdir -p whatsnew
          for FILE in docs/whatsnew/${VERSION}-*; do
            if [ -f "$FILE" ]; then
              LOCALE=$(basename "$FILE" | sed "s/^${VERSION}-//")
              cp "$FILE" "whatsnew/whatsnew-${LOCALE}"
            fi
          done

          # This job checks out the ref it was triggered on, but takes the artifacts from the
          # tag. Deploy a tag whose what's-new files are not on that ref — an older tag, or a
          # release whose notes never reached this branch — and the glob above matches nothing,
          # the [ -f ] guard skips every iteration without complaint, and the upload silently
          # ships with no release notes at all. Refuse instead of guessing.
          COUNT=$(find whatsnew -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No what's-new files matched docs/whatsnew/${VERSION}-* in the ${{ github.ref_name }} checkout. Play would receive an empty release-notes directory."
            exit 1
          fi
          echo "Prepared $COUNT locale file(s) for $VERSION."

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: de.autosugar
          releaseFiles: release-assets/*.aab
          # `tracks`, not `track`: the action warns that the singular form is deprecated, and
          # refuses outright if both are set. It takes a comma-separated list; this workflow
          # deliberately passes exactly one, which is why its own input stays singular.
          #
          # It must never arrive empty — the action defaults to *production* when neither input
          # is given, which is not a default anything here should fall into by accident. Hence
          # the `|| 'internal'` as well as the input's own default.
          tracks: ${{ inputs.track || 'internal' }}
          whatsNewDirectory: whatsnew/
          # Empty when the release carried no mapping.txt; the action skips the input then.
          mappingFile: ${{ steps.mapping.outputs.path }}
          # Play demands this parameter in both directions depending on the state it has put
          # the app in, and refuses the commit either way when it disagrees:
          #
          #   unset/false → "Changes cannot be sent for review automatically. Please set the
          #                  query parameter changesNotSentForReview to true."  (1.2.9)
          #   true        → "Changes are sent for review automatically. The query parameter
          #                  changesNotSentForReview must not be set."          (1.2.7)
          #
          # Neither value is correct for all time, which is why this is an input rather than a
          # hardcoded choice — flip it when Play flips, no workflow edit needed.
          #
          # It defaults to true because the app currently has an open policy rejection, and a
          # rejection has to be cleared by assembling the release by hand anyway: the
          # noncompliant version codes must be moved to "Not Included" on every track before
          # anything is sent for review. Auto-submitting would send a release that still
          # carries them. Once the app is out of that state, false restores the hands-off
          # behaviour that suits this app's slow reviews (see AGENTS.md, Maintenance Policy).
          changesNotSentForReview: ${{ inputs.changesNotSentForReview }}
